name: uk_markets_lakehouse
version: 0.1.0
config-version: 2
profile: uk_markets_lakehouse
model-paths:
- models
macro-paths:
- macros
test-paths:
- tests
target-path: target
clean-targets:
- target
- dbt_packages
vars:
  # The headline series of each dataset: total GDP (A--T) and all-items CPIH (CP00).
  gdp_headline: "A--T"
  cpih_headline: "CP00"

models:
  uk_markets_lakehouse:
    staging:
      +schema: silver
      +materialized: view
    intermediate:
      +schema: silver
      +materialized: table
    marts:
      +schema: gold
      +materialized: table
