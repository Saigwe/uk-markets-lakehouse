version: 2
models:
  - name: stg_lake__observations
    data_tests:
      - unique_combination:
          arguments:
            columns: [dataset_id, series_code, period, vintage]
    columns:
      - name: dataset_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gdp-to-four-decimal-places, cpih01, iadb-daily-rates]
      - name: period
        data_tests: [not_null]
      - name: frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [monthly, daily]
