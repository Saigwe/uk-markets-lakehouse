# Synthetic fixture for CI. Same table and column names as the real-data load.
# pk / fk / cast describe the tables for staging and tests; the generator ignores them.
seed: 1616
tables:
  - name: series
    pk: series_id
    data:
      columns: [series_id, source, title, unit, frequency]
      rows:
        - [IUMABEDR, boe, Official Bank Rate, percent, monthly]
        - [L55O, ons, CPIH annual rate, percent, monthly]
        - [ECY2, ons, GDP monthly index, index, monthly]
        - [XUMAUSS, boe, GBP to USD spot rate, rate, monthly]
  - name: observations
    grid: {parent: series.series_id, start: 2020-01-01, end: 2025-06-01, freq: MS, column: obs_date}
    pk: [series_id, obs_date, vintage_ts]
    fk: {series_id: series.series_id}
    cast: {obs_date: date}
    columns:
      value: {type: float, low: 0.1, high: 110, decimals: 3}
      vintage_ts: {type: expr, expr: "df.obs_date + pd.to_timedelta(rng.integers(20, 45, n), unit='D')"}
    duplicate: {rows: 40, shift_column: vintage_ts, shift_minutes: 43200, jitter: {value: 0.01}}
